name: Avisar nuevos issues
on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar a Telegram
        env:
          AUTOR: ${{ github.event.issue.user.login }}
          TITULO: ${{ github.event.issue.title }}
          CUERPO: ${{ github.event.issue.body }}
          ETIQUETAS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MENSAJE=$(printf '🐛 <b>Nuevo issue</b> en %s\n\n<b>Título:</b> %s\n<b>Autor:</b> %s\n<b>Etiquetas:</b> %s\n\n<b>Contenido:</b>\n%s\n\n🔗 %s' \
            "$REPO" "$TITULO" "$AUTOR" "${ETIQUETAS:-sin etiquetas}" "${CUERPO:-(sin descripción)}" "$URL")

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${MENSAJE}"
