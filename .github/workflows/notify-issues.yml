name: Avisar nuevos issues
on:
  issues:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar a Telegram
        env:
          AUTOR: ${{ github.event.issue.user.login }}
          TITULO: ${{ github.event.issue.title }}
          CUERPO: ${{ github.event.issue.body }}
          ETIQUETAS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
        run: |
          MENSAJE="🐛 <b>Nuevo issue</b> en ${REPO}

<b>Título:</b> ${TITULO}
<b>Autor:</b> ${AUTOR}
<b>Etiquetas:</b> ${ETIQUETAS:-sin etiquetas}

<b>Contenido:</b>
${CUERPO:-(sin descripción)}

🔗 ${URL}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${MENSAJE}"
